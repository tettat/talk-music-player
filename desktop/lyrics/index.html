<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>小黄花 · 桌面歌词</title>
  <link rel="stylesheet" href="overlay.css">
  <script defer src="overlay.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="previous" viewBox="0 0 24 24"><path d="M6 6v12M18 6l-9 6 9 6Z"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="M18 6v12M6 6l9 6-9 6Z"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="grip" viewBox="0 0 24 24"><path d="M8 5h.01M16 5h.01M8 12h.01M16 12h.01M8 19h.01M16 19h.01" stroke-width="3"/></symbol>
  </defs></svg>
  <section class="lyric-shell" aria-label="桌面歌词">
    <div class="toolbar" role="toolbar" aria-label="歌词控制">
      <span class="grip" title="拖动"><svg><use href="#grip"/></svg></span>
      <span class="song" id="song"></span>
      <div class="controls transport">
        <button type="button" id="previous-button" aria-label="上一首" title="上一首"><svg><use href="#previous"/></svg></button>
        <button type="button" id="play-button" class="play-button" aria-label="播放" title="播放"><svg><use id="play-icon" href="#play"/></svg></button>
        <button type="button" id="next-button" aria-label="下一首" title="下一首"><svg><use href="#next"/></svg></button>
      </div>
      <span class="divider"></span>
      <div class="controls">
        <button type="button" id="font-down" class="font-button" aria-label="缩小歌词" title="缩小歌词">A<span>−</span></button>
        <button type="button" id="font-up" class="font-button" aria-label="放大歌词" title="放大歌词">A<span>+</span></button>
        <button type="button" id="lock-button" aria-label="锁定歌词" title="锁定 · Ctrl+Alt+L 或播放器右键解锁"><svg><use href="#lock"/></svg></button>
        <button type="button" id="close-button" class="close-button" aria-label="关闭桌面歌词" title="关闭桌面歌词"><svg><use href="#close"/></svg></button>
      </div>
    </div>
    <div class="lyric-stage">
      <p class="current" id="current" aria-live="off">♪</p>
      <p class="next" id="next-line"></p>
    </div>
  </section>
</body>
</html>
